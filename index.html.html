<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Little Birthday Quest</title>
<style>
:root{--bg:#170f2b;--panel:#25183d;--pink:#ff8fbd;--cream:#fff2e8;--muted:#cbbbd9;--gold:#ffd78a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,#49305f 0,transparent 32%),radial-gradient(circle at 90% 85%,#442448 0,transparent 30%),var(--bg);color:var(--cream);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:22px}
main{width:min(720px,100%)}.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.85rem;margin-bottom:14px}.pill{border:1px solid #ffffff25;border-radius:999px;padding:6px 12px}
.card{background:linear-gradient(145deg,#2b1c45ee,#211630f2);border:1px solid #ffffff20;border-radius:26px;padding:clamp(22px,5vw,42px);box-shadow:0 24px 80px #08041088;min-height:440px;position:relative;overflow:hidden}
.card:before{content:"✦";position:absolute;right:26px;top:12px;color:#ffd78a55;font-size:3rem}
.eyebrow{color:var(--pink);text-transform:uppercase;letter-spacing:.16em;font-size:.75rem;font-weight:700}
h1{font-family:Georgia,serif;font-weight:500;font-size:clamp(2.2rem,7vw,4rem);line-height:1.05;margin:14px 0}
h2{font:500 clamp(1.7rem,5vw,2.5rem)/1.15 Georgia,serif;margin:12px 0}
p{color:var(--muted);max-width:58ch}.hero{font-size:4.5rem;margin:12px 0 4px;filter:drop-shadow(0 8px 20px #ff8fbd33)}
button{border:0;border-radius:14px;padding:13px 19px;background:var(--pink);color:#32152b;font-weight:750;font-size:1rem;cursor:pointer;margin:8px 8px 0 0;transition:transform .15s,filter .15s}
button:hover{transform:translateY(-2px);filter:brightness(1.06)}button.secondary{background:#ffffff12;color:var(--cream);border:1px solid #ffffff30}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #ffffff35;background:#160f25;color:white;font:inherit;margin:8px 0}
.choices{display:grid;gap:10px;margin-top:20px}.choices button{text-align:left;margin:0;background:#ffffff10;color:var(--cream);border:1px solid #ffffff25}.choices button:hover{border-color:var(--pink)}
.progress{height:5px;background:#ffffff18;border-radius:10px;overflow:hidden;margin:0 0 20px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--gold));transition:width .3s}
.note{background:#ffffff0c;border-left:3px solid var(--gold);padding:14px 16px;border-radius:0 12px 12px 0;color:var(--cream);margin:18px 0}
.small{font-size:.85rem;color:var(--muted)}.hidden{display:none!important}.center{text-align:center}.heart{color:var(--pink)}
footer{text-align:center;color:#a99ab9;font-size:.78rem;margin-top:14px}
</style>
</head>
<body>
<main>
 <div class="top"><span>✦ A LITTLE BIRTHDAY QUEST</span><span class="pill" id="stepLabel">A surprise awaits</span></div>
 <div class="progress"><div class="bar" id="bar"></div></div>
 <section class="card" id="screen"></section>
 <footer>Made with <span class="heart">♥</span> · A tiny adventure made just for you</footer>
</main>
<script>
const screen=document.getElementById('screen'),bar=document.getElementById('bar'),stepLabel=document.getElementById('stepLabel');
let stage=0,score=0;
function render(){
 const pages=[
 `<div class="center"><div class="hero">🎂✨</div><div class="eyebrow">A birthday mission from Ajay</div><h1>Today is all about you, Mussu.</h1><p style="margin:0 auto">There are little surprises hidden in this adventure. Follow the clues, trust your instincts, and collect the moments waiting for you.</p><div class="note">Your mission: discover the birthday surprise at the end. Your co-conspirator is Ajay. Ready, Mussu?</div><button onclick="next()">Start my adventure →</button></div>`,
 `<div class="eyebrow">Chapter 01 · The warm-up</div><h2>First, a tiny test…</h2><p>Which of these is the best ingredient for an unforgettable day?</p><div class="choices"><button onclick="answer(0)">A. Perfect weather</button><button onclick="answer(1)">B. Your favourite people</button><button onclick="answer(0)">C. A mountain of presents</button></div><p class="small">There are no wrong answers. (Okay, maybe one or two.)</p>`,
 `<div class="eyebrow">Chapter 02 · A little mystery</div><h2>Crack the birthday code</h2><p>I have a face but no eyes, hands but no arms. I can tell you when a moment begins, but I can't make it stay. What am I?</p><input id="riddle" placeholder="Type your answer…" autocomplete="off"><button onclick="checkRiddle()">Unlock the next clue</button><p class="small" id="riddleHint">Hint: You might check me when you're running late.</p>`,
 `<div class="eyebrow">Chapter 03 · Choose your magic</div><h2>Pick a little birthday wish</h2><p>Every choice unlocks a different kind of good energy for the year ahead.</p><div class="choices"><button onclick="wish('adventure')">🌍 More adventures and new places</button><button onclick="wish('laughter')">😂 More laughter and silly moments</button><button onclick="wish('dreams')">🌟 Big dreams coming true</button></div>`,
 `<div class="center"><div class="hero">💌</div><div class="eyebrow">Final chapter · Your surprise</div><h1>Quest complete.</h1><p style="margin:0 auto">You found every clue. But the best part of this birthday isn't hidden in a game.</p><div class="note" id="finalNote">It's waiting in the real world — with Ajay, who wanted to make you smile today. ❤️</div><h2>One last thing…</h2><p style="margin:0 auto">Your special surprise is ready. Reach out to Ajay and tell him: <strong>“I completed the quest!”</strong></p><button onclick="reveal()">Enter the secret room 🔐</button>
 <div id="reveal" class="hidden">
  <div class="note"><strong>📸 The memory corner</strong><br>We don't need a perfect photo album to celebrate our story. Here's to the little moments, the silly conversations, the unexpected laughs, and everything still waiting for us. <span class="small">(You can add photos here later if you ever want.)</span></div>
  <div class="note"><strong>💌 A note from Ajay</strong><br><span id="letter">Mussu, these 2–3 years are a chapter I’m grateful for. I hope you never forget how special you are. I’m cheering for every dream you chase, every new thing you try, and every smile that finds you. Happy Birthday. ❤️ — Ajay</span></div>
  <div class="center"><div class="hero">🎁</div><button onclick="openGift()">Open your virtual gift</button><div id="gift" class="note hidden">✨ Your gift is a promise of more memories to make, more laughs to share, and more adventures ahead. This is only the beginning. ❤️</div></div>
 </div></div>`
 ];
 screen.innerHTML=pages[stage];bar.style.width=((stage)/4*100)+'%';stepLabel.textContent=`Chapter ${stage+1} of 5`;
}
function next(){stage++;render()}
function answer(n){if(n===1)score++;stage++;render()}
function checkRiddle(){let v=(document.getElementById('riddle').value||'').trim().toLowerCase();if(['clock','a clock','watch','a watch'].includes(v)){score++;stage++;render()}else document.getElementById('riddleHint').textContent="Not quite! Hint: It has a face and hands. Try “clock”."}
function wish(kind){const msgs={adventure:"May your year be full of beautiful places and stories.",laughter:"May your laugh be loud, frequent, and impossible to contain.",dreams:"May the things you quietly wish for find their way to you."};document.getElementById('finalNote').textContent=msgs[kind]+" And may you always know how loved you are. ❤️";stage++;render()}
function reveal(){document.getElementById('reveal').classList.remove('hidden')}\nfunction openGift(){document.getElementById('gift').classList.remove('hidden')}
render();
</script>
</body></html>
